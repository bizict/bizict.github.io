<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.55" stop-color="#ff4d8d"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <radialGradient id="glow1" cx="78%" cy="26%" r="55%">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="14%" cy="88%" r="50%">
      <stop offset="0" stop-color="#ff4d8d" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff4d8d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="#0a0a14"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- 상단 그라디언트 라인 -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#grad)"/>

  <!-- 배지 -->
  <g>
    <rect x="80" y="96" width="360" height="52" rx="26" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.14)"/>
    <circle cx="112" cy="122" r="7" fill="#3ddc97"/>
    <text x="134" y="130" fill="#a3a3bd" font-size="22" font-weight="700">2027 전기 신입생 모집</text>
  </g>

  <!-- 메인 카피 -->
  <text x="80" y="268" fill="#f4f4fb" font-size="76" font-weight="900" letter-spacing="-2">좋아요를 넘어,</text>
  <text x="80" y="366" font-size="92" font-weight="900" letter-spacing="-2" fill="url(#grad)">비즈니스로.</text>

  <!-- 서브 카피 -->
  <text x="82" y="438" fill="#a3a3bd" font-size="30" font-weight="500">인플루언서&amp;크리에이터비즈니스(ICB) 트랙</text>

  <!-- 하단 기관명 + 수업 방식 -->
  <text x="80" y="548" fill="#f4f4fb" font-size="30" font-weight="800">국민대학교 비즈니스IT전문대학원</text>
  <text x="80" y="588" fill="#a3a3bd" font-size="24" font-weight="500">평일 저녁 · 주말 수업 · 전공 무관 · bizict.github.io</text>

  <!-- 우측 로고 마크 -->
  <g transform="translate(980,150)">
    <rect width="140" height="140" rx="34" fill="#0d0d18" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
    <text x="70" y="98" text-anchor="middle" font-size="62" font-weight="900" fill="url(#grad)">ICB</text>
  </g>
</svg>
